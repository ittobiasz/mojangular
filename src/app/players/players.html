<div class="players-container page">
  <div class="content panel">
    <h2>Hráči</h2>

    <div class="toolbar" style="display:flex;gap:1rem;align-items:center;flex-wrap:wrap;margin-bottom:0.6rem;">
      <app-search [(value)]="searchTerm" placeholder="Hľadaj hráča..."></app-search>
      <label style="color:rgba(255,255,255,0.85);font-weight:700;">
        Filter podľa levelu
        <select [(ngModel)]="selectedLevelTitle" style="margin-left:0.5rem;padding:0.45rem;border-radius:8px;background:transparent;border:1px solid rgba(255,77,109,0.08);color:inherit;font-weight:600;">
          <option [ngValue]="''">— všetky —</option>
          <option *ngFor="let lvl of availableLevels" [ngValue]="lvl.title">{{ lvl.title }}</option>
        </select>
      </label>

      <button class="add-btn btn" (click)="toggleForm()">{{ formShown ? 'Zrušiť' : '+ Pridať hráča' }}</button>
    </div>

  <div class="add-form" *ngIf="formShown">
    <label>
      Prezývka
      <input type="text" [(ngModel)]="newNickname" placeholder="Zadaj prezývku">
    </label>
    <label>
      XP
      <input type="number" [(ngModel)]="newXp" min="0">
    </label>
    <label>
    </label>

    <div class="quest-choices">
      <p>Priraď až 5 questov:</p>
      <div *ngFor="let q of questsList()" class="quest-choice">
        <label>
          <input type="checkbox" [checked]="selectedQuests.includes(q.id)" (change)="toggleQuestSelection(q.id)"
                 [disabled]="selectedQuests.length >= 5 && !selectedQuests.includes(q.id)">
          {{ q.title }} ({{ q.xp }} XP)
        </label>
      </div>
    </div>

    <label>
      Priradiť do klanu (voliteľné)
      <select [(ngModel)]="selectedClanId">
        <option [ngValue]="undefined">— bez klanu —</option>
        <option *ngFor="let c of clans()" [ngValue]="c.id">{{ c.name }} ({{c.members.length}}/{{c.capacity}})</option>
      </select>
    </label>

    <div class="form-actions">
      <button (click)="submitAdd()" class="confirm">Vytvoriť hráča</button>
      <button (click)="toggleForm()" class="cancel">Zrušiť</button>
    </div>
  </div>

  <div *ngFor="let player of getDisplayedPlayers()" class="player-card">
    <h3><a [routerLink]="['/players', player.id]">{{ player.nickname }}</a></h3>
    <p>
      {{ getLevelInfo(player).current.title }} (Level {{ getLevelInfo(player).current.level }})
    </p>
    <div class="progress">
      <div class="progress-fill" [style.width.%]="getLevelInfo(player).percent"></div>
    </div>
    <p *ngIf="player.quests?.length">Questy:
      <span *ngFor="let qid of player.quests; let i = index">
  {{ getQuestTitle(qid) }}<span *ngIf="isNotLastQuest(player, i)">, </span>
      </span>
    </p>
  <p *ngIf="player.clanId">Klan: {{ getClanName(player.clanId) }}</p>
    <img *ngIf="player.avatarUrl" [src]="player.avatarUrl" alt="{{ player.nickname }}" width="100">
    <div class="card-actions">
      <button (click)="removePlayer(player)" class="danger">Odstrániť hráča</button>
    </div>
  </div>
    </div>
  </div>
