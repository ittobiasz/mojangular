<div class="clans-container page">
  <div class="content panel">
    <h2>Klany</h2>

    <div class="toolbar" style="display:flex;gap:1rem;align-items:center;flex-wrap:wrap;margin-bottom:0.6rem;">
      <app-search [(value)]="searchTerm" placeholder="Hľadaj klan..."></app-search>
      <button class="add-btn btn" (click)="toggleForm()">{{ formShown ? 'Zrušiť' : '+ Pridať klan' }}</button>
    </div>
    
    @if (formShown) {
      <form (ngSubmit)="submitAddClan()" class="add-form">
        <label>
          Názov
          <input type="text" [field]="clanForm.name" placeholder="Názov klanu">
        </label>
        <label>
          Popis
          <input type="text" [field]="clanForm.description" placeholder="Krátky popis">
        </label>
        <label>
          Kapacita
          <input type="number" [field]="clanForm.capacity">
        </label>
        <label>
        </label>
        <div class="form-actions">
          <button type="submit" class="confirm">Vytvoriť klan</button>
          <button type="button" (click)="toggleForm()" class="cancel">Zrušiť</button>
        </div>
      </form>
    }

    @for (clan of getDisplayedClans(); track clan) {
      <div class="clan-card">
        <h3><a [routerLink]="['/clans', clan.id]">{{ clan.name }}</a></h3>
        <p>{{ clan.description }}</p>
        <p>Kapacita: {{ clan.members.length }}/{{ clan.capacity }}</p>
        <p>Členovia: {{ clan.members.length }}</p>
        @if (clan.avatarUrl) {
          <img [src]="clan.avatarUrl" alt="{{ clan.name }}" width="100">
        }
        <div class="card-actions">
          <button (click)="removeClan(clan)" class="danger">Odstrániť klan</button>
        </div>
      </div>
    }
  </div>
</div>
